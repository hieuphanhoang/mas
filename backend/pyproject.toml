[project]
name = "mas-backend"
version = "0.1.0"
requires-python = ">=3.12.12"
dependencies = [
    "fastapi==0.161.1",
    "jsonschema==4.26.0",
    "pydantic==2.14.1",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[project.scripts]
mas = "mas_backend.cli:main"

# The local package uses a stdlib-only wheel builder; no extra build install.
[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "build_backend.py" }, { file = "src/**/*.py" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.86.0",
    "httpx==0.28.1",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]
